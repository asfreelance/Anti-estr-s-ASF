<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>As Freelance · Experiencias</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ac:#4f8fe0;--ac2:#2c5282;--g:#00ffc3;--ft:'Orbitron','Segoe UI',sans-serif;--fb:'Inter','Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:#050607}
body{min-height:100vh;color:#f2f5fa;font-family:var(--fb);background:radial-gradient(ellipse 80% 55% at 50% 0%,#12264a 0%,#08111f 48%,#050607 85%);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);-webkit-user-select:none;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 22px}
.brand{display:flex;align-items:center;gap:10px;font:700 clamp(19px,2.1vw,27px) var(--ft);letter-spacing:.07em}
.brand img{width:clamp(46px,4.4vw,58px);height:auto;filter:drop-shadow(0 0 12px #4f8fe088)}
.brand b{color:var(--ac2)}
button{font-family:inherit}
#snd{font-size:15px;color:#fff;border:1px solid #ffffff40;border-radius:999px;width:40px;height:40px;background:#0008;cursor:pointer}
.wrap{max-width:min(1640px,98vw);margin:0 auto;padding:0 12px 26px}
.hero{text-align:center;padding:0 0 8px}
.tag{display:inline-flex;align-items:center;gap:10px;font:600 11px var(--ft);letter-spacing:.3em;color:var(--g);border:1px solid #00ffc355;border-radius:999px;padding:8px 15px;background:#00ffc30d}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g)}
h1{font:900 clamp(34px,6.6vw,84px)/1.02 var(--ft);margin:8px 0 6px;background:linear-gradient(180deg,#fff 20%,#8fa9d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#a8bad6;font-size:clamp(14px,1.5vw,18px)}
.tabs{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:4px 0 10px}
.tab{font:600 13px var(--fb);color:#c7d6ee;border:1px solid #ffffff2a;background:#0a1424cc;border-radius:999px;padding:7px 12px;cursor:pointer;transition:.2s}
.tab:hover{border-color:var(--ac)}
.tab.on{color:#00140f;background:var(--g);border-color:var(--g);box-shadow:0 0 22px #00ffc355}
.stage{position:relative;height:clamp(460px,calc(100vh - 270px),940px);border-radius:22px;border:1px solid #ffffff22;overflow:hidden;background:#0a1220;box-shadow:0 24px 90px #000a}
#cv{position:absolute;inset:0;touch-action:none;display:block;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font-size:14px;color:#9fb2cf;flex-wrap:wrap}
#stat{font:600 13px var(--ft);color:var(--g);letter-spacing:.08em}
#reset{font:600 13px var(--fb);color:#fff;border:1px solid #ffffff40;background:#0008;border-radius:999px;padding:9px 16px;cursor:pointer}
#reset:hover{background:#fff;color:#000}
#sub{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;gap:8px;flex-wrap:wrap;justify-content:center;max-width:94%;z-index:3}
.sb{font:600 13px var(--fb);color:#d5e2f7;border:1px solid #ffffff33;background:#0a1424e6;border-radius:999px;padding:8px 14px;cursor:pointer}
.sb.on{color:#00140f;background:var(--g);border-color:var(--g)}
.hb{display:flex;align-items:center;gap:10px}
.cta{font:600 13px var(--fb);text-decoration:none;white-space:nowrap;border-radius:999px;padding:10px 16px;transition:.2s}
.cta.ag{color:var(--g);border:1px solid var(--g);background:#00ffc312}.cta.ag:hover{background:var(--g);color:#00140f}
.cta.wa{color:#04170c;background:#25d366;border:1px solid #25d366}.cta.wa:hover{background:#fff;border-color:#fff}
.cta .sm{display:none}
@media(max-width:620px){.cta{padding:9px 12px;font-size:12px}.cta .lg{display:none}.cta .sm{display:inline}.brand span{display:none}.hb{gap:8px}}
</style>
</head>
